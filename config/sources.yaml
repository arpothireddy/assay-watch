# Source adapter registry — PURE DATA. Adapters are declared here, never wired up
# by scattered imports. See docs/SOURCES.md for per-source terms and the chosen
# access approach.

sources:
  # ── Shopify storefront JSON ────────────────────────────────────────────────
  # Each store is fetched from its public /products.json endpoint. A store must
  # only be enabled after its robots.txt AND its own terms have been checked and
  # recorded in docs/SOURCES.md.
  #
  # Verified so far: /products.json reachable, robots.txt permits it. ToS review
  # is a separate, still-open item per store — see docs/SOURCES.md.
  - type: shopify
    enabled: true
    # Bumped from 3.0 -> 6.0: craftandtailored.com returned repeated 429s at
    # 3s/host even with the client's existing retry+backoff. This is a daily
    # batch job with no time pressure, so slower and more conservative costs
    # nothing. Applies per-host, so it doesn't slow down the other 6 stores
    # relative to each other -- each store gets its own independent gate.
    min_interval_seconds: 6.0
    stores:
      - name: "windup-watch-shop"
        base_url: "https://windupwatchshop.com"
        currency: "USD"
        enabled: true
      - name: "topper-jewelers"
        base_url: "https://topperjewelers.com"
        currency: "USD"
        enabled: true
      - name: "analog-shift"
        base_url: "https://analogshift.com"
        currency: "USD"
        enabled: true
      - name: "hodinkee-shop"
        base_url: "https://shop.hodinkee.com"
        currency: "USD"
        enabled: true
      - name: "craft-and-tailored"
        base_url: "https://craftandtailored.com"
        currency: "USD"
        enabled: true
      - name: "bulang-and-sons"
        base_url: "https://bulangandsons.com"
        currency: "GBP"
        enabled: true
      - name: "collective-horology"
        base_url: "https://collectivehorology.com"
        enabled: true

  # ── eBay APIs ──────────────────────────────────────────────────────────────
  # Registered but unconfigured until developer-program credentials are set
  # (ASSAY_EBAY_CLIENT_ID / ASSAY_EBAY_CLIENT_SECRET). While unconfigured the
  # crawl skips it — this is an expected state, not a failure.
  - type: ebay
    enabled: true
    marketplace: "EBAY_US"
