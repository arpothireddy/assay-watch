# Source adapter registry — PURE DATA. Adapters are declared here, never wired up
# by scattered imports. See docs/SOURCES.md for per-source terms and the chosen
# access approach.

sources:
  # ── Shopify storefront JSON ────────────────────────────────────────────────
  # Each store is fetched from its public /products.json endpoint. A store must
  # only be enabled after its robots.txt AND its own terms have been checked and
  # recorded in docs/SOURCES.md.
  #
  # Verified so far: /products.json reachable, robots.txt permits it. ToS review
  # is a separate, still-open item per store — see docs/SOURCES.md.
  - type: shopify
    enabled: true
    # Bumped from 3.0 -> 6.0: craftandtailored.com returned repeated 429s at
    # 3s/host even with the client's existing retry+backoff. This is a daily
    # batch job with no time pressure, so slower and more conservative costs
    # nothing. Applies per-host, so it doesn't slow down the other 6 stores
    # relative to each other -- each store gets its own independent gate.
    min_interval_seconds: 6.0
    stores:
      - name: "windup-watch-shop"
        base_url: "https://windupwatchshop.com"
        currency: "USD"
        enabled: true
      - name: "topper-jewelers"
        base_url: "https://topperjewelers.com"
        currency: "USD"
        enabled: true
      - name: "analog-shift"
        base_url: "https://analogshift.com"
        currency: "USD"
        enabled: true
      - name: "hodinkee-shop"
        base_url: "https://shop.hodinkee.com"
        currency: "USD"
        enabled: true
      - name: "craft-and-tailored"
        base_url: "https://craftandtailored.com"
        currency: "USD"
        enabled: true
      - name: "bulang-and-sons"
        base_url: "https://bulangandsons.com"
        currency: "GBP"
        enabled: true
      - name: "collective-horology"
        base_url: "https://collectivehorology.com"
        enabled: true

      # ── Added 2026-09-12 ──────────────────────────────────────────────
      # Multi-brand dealers. These are the ones that address the coverage
      # gap: the tracked references are modern Rolex/Patek/AP grails, and
      # until now the enabled stores were mostly vintage and microbrand
      # specialists that legitimately never stock them.
      - name: "watchguys"
        base_url: "https://www.watchguys.com"
        currency: "USD"
        enabled: true
      - name: "swiss-watch-expo"
        base_url: "https://www.swisswatchexpo.com"
        currency: "USD"
        enabled: true
      - name: "theo-and-harris"
        base_url: "https://theoandharris.com"
        currency: "USD"
        enabled: true

      # Single-brand storefronts: each sells only its own watches, so none
      # of them can match a tracked reference today. Enabled because they
      # were vetted and cost little to poll, but they will return nothing
      # until the reference catalogue covers these brands -- they are not
      # part of the coverage fix.
      - name: "oak-and-oscar"
        base_url: "https://oakandoscar.com"
        currency: "USD"
        enabled: true
      - name: "autodromo"
        base_url: "https://autodromo.com"
        currency: "USD"
        enabled: true
      # Currency deliberately unset for these two rather than guessed. It is
      # read from this file, never from the product payload, so a wrong guess
      # would price a GBP or CAD listing as dollars and corrupt every median
      # it landed in. Unset means the row is counted as non-USD and excluded
      # from pricing -- visibly missing beats quietly wrong.
      - name: "bremont"          # UK-based; presentment currency unconfirmed
        base_url: "https://www.bremont.com"
        enabled: true
      - name: "halios-watches"   # Canada-based; presentment currency unconfirmed
        base_url: "https://halioswatches.com"
        enabled: true

      # ── Added 2026-09-12 (second batch) ───────────────────────────────
      # Multi-brand US luxury retailers -- NY and LA. This is the batch that
      # should actually move coverage: between them they carry the modern
      # Rolex, Patek and AP the tracked catalogue is built around.
      - name: "cellini-jewelers"
        base_url: "https://www.cellinijewelers.com"
        currency: "USD"
        enabled: true
      - name: "material-good"
        base_url: "https://materialgood.com"
        currency: "USD"
        enabled: true
      - name: "avi-and-co"
        base_url: "https://www.aviandco.com"
        currency: "USD"
        enabled: true
      - name: "feldmar-watch"
        base_url: "https://feldmarwatch.com"
        currency: "USD"
        enabled: true
      - name: "hl-gross"
        base_url: "https://www.hlgross.com"
        currency: "USD"
        enabled: true

      # Single-brand again, and further afield than the rest: both sell only
      # their own watches, and neither is in the luxury segment the tracked
      # catalogue covers. They will match no tracked reference. Enabled as
      # supplied, but flag them if the catalogue is meant to stay luxury.
      - name: "shinola"
        base_url: "https://www.shinola.com"
        currency: "USD"
        enabled: true
      - name: "nixon"
        base_url: "https://www.nixon.com"
        currency: "USD"
        enabled: true

  # ── eBay APIs ──────────────────────────────────────────────────────────────
  # Registered but unconfigured until developer-program credentials are set
  # (ASSAY_EBAY_CLIENT_ID / ASSAY_EBAY_CLIENT_SECRET). While unconfigured the
  # crawl skips it — this is an expected state, not a failure.
  - type: ebay
    enabled: true
    marketplace: "EBAY_US"
