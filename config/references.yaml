    enabled: true
  - ref: "310.30.42.50.01.002"
    brand: "Omega"
    model_name: "Speedmaster Moonwatch Professional"
    # "Moonwatch Professional" dropped: Omega has used this marketing name
    # across multiple reference generations (hesalite, sapphire, different
    # calibers) -- not unique to this reference.
    search_aliases: ["310.30.42.50.01.002"]
    enabled: true
  - ref: "210.30.42.20.01.001"
    brand: "Omega"
    model_name: "Seamaster Diver 300M"
    # "Seamaster Diver 300M" dropped: this family name spans many different
    # colorway/bezel references, each its own distinct product.
    search_aliases: ["210.30.42.20.01.001"]
    enabled: true
  - ref: "5711/1A"
    brand: "Patek Philippe"
    model_name: "Nautilus"
    # Bare "5711" dropped: shared with other material/dial variants of the
    # same base number (5711R rose gold, special editions, ...).
    search_aliases: ["5711/1A", "5711 1A"]
    enabled: true
  - ref: "5712/1A"
    brand: "Patek Philippe"
    model_name: "Nautilus Moon Phase"
    # Bare "5712" dropped -- same reasoning as 5711/1A above.
    search_aliases: ["5712/1A", "5712 1A"]
    enabled: true
  - ref: "15500ST"
    brand: "Audemars Piguet"
    model_name: "Royal Oak"
    # Bare "15500" dropped: shared with other material variants (15500BC,
    # 15500OR, ...) of the same base number.
    search_aliases: ["15500ST"]
    enabled: true
  - ref: "15400ST"
    brand: "Audemars Piguet"
    model_name: "Royal Oak"
    # Bare "15400" dropped -- same reasoning as 15500ST above.
    search_aliases: ["15400ST"]
    enabled: true
  - ref: "M79030N"
    brand: "Tudor"
    model_name: "Black Bay Fifty-Eight"
    # "Fifty-Eight" / "Fifty Eight" dropped: that's the model FAMILY name,
    # also used by the discontinued non-M-prefix "79030" (older manufacture
    # caliber) -- confirmed matching those listings in practice. "79030N"
    # (with the N suffix) still reliably identifies the current generation.
    search_aliases: ["M79030N", "79030N"]
    enabled: true
  - ref: "M7941A1A0RU"
