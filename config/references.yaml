# Canonical reference registry — PURE DATA, no code reads it but the loader.
#
# Seeded with liquid steel sports references. This list is meant to be edited and
# extended freely: add entries, toggle `enabled`, refine `search_aliases` with the
# strings sellers actually use. Aliases drive Phase 0's crude client-side matching,
# so keep them specific enough to avoid matching unrelated models.
#
# Each entry:
#   ref            canonical reference number
#   brand          maker
#   model_name     human name
#   search_aliases strings a listing title/handle/sku might use for this ref
#   enabled        include in crawls when true

references:
  - ref: "126610LN"
    brand: "Rolex"
    model_name: "Submariner Date"
    search_aliases: ["126610LN", "126610 LN"]
    enabled: true
  - ref: "126710BLRO"
    brand: "Rolex"
    model_name: "GMT-Master II Pepsi"
    # "Pepsi" dropped: the nickname is shared across multiple red/blue GMT
    # references over the decades (16700, 1675, 16750, ...), not unique to
    # this one -- confirmed matching a vintage 16710 listing in practice.
    search_aliases: ["126710BLRO"]
    enabled: true
  - ref: "124300"
    brand: "Rolex"
    model_name: "Oyster Perpetual 41"
    search_aliases: ["124300"]
    enabled: true
  - ref: "116500LN"
    brand: "Rolex"
    model_name: "Daytona"
    search_aliases: ["116500LN", "116500 LN"]
    enabled: true
  - ref: "126710BLNR"
    brand: "Rolex"
    model_name: "GMT-Master II Batman"
    # "Batman"/"Batgirl" dropped: same nickname-collision risk as "Pepsi"
    # above -- not provably unique to this reference.
    search_aliases: ["126710BLNR"]
    enabled: true
  - ref: "126334"
    brand: "Rolex"
    model_name: "Datejust 41"
    search_aliases: ["126334"]
    enabled: true
  - ref: "214270"
    brand: "Rolex"
