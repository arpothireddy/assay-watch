name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASSAY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/assay_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Put uv on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync (locked)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy src tests
      - name: Tests + coverage
        run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Put uv on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export locked runtime deps
        run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - name: pip-audit
        run: uvx pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t assay-watch:ci .
