[project]
name = "assay-watch"
version = "0.0.0"
description = "Independent valuation and negotiation-leverage layer for luxury watches. Phase 0: the data spine."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.scripts]
assay = "assay_watch.cli:main"

[dependency-groups]
# uv-native dev dependencies (PEP 735). Installed with `uv sync`, excluded from
# the runtime image.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay_watch"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# selectolax ships no type stubs; treat it as untyped rather than erroring.
module = ["selectolax.*"]
ignore_missing_imports = true

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "--cov=assay_watch --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["assay_watch"]
