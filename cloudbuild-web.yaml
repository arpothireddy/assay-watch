# Auto-fires on push to main. Builds both new images, deploys them to
# STAGING Cloud Run services, and runs a real smoke test against the live
# staging URLs. Never touches production. On success, tags both images
# "staging-verified" and fires cloudbuild-web-promote.yaml with the exact
# commit SHA that passed -- that trigger requires manual approval
# (--require-approval) before it deploys anything, so nothing reaches
# production without a human saying so.
#
# Deploying by the exact $SHORT_SHA-tagged image (not the floating
# "staging-verified" tag) at promote time matters: if two pushes land close
# together, the tag could move to a newer commit before the first promote
# request gets approved. Passing the SHA explicitly means what gets approved
# is what gets deployed, not whatever "staging-verified" happens to point at
# by then.

substitutions:
  _REGION: us-central1
  _AR_REPO: assay-watch
  # Renamed from assay-watch-{mcp,web}-staging: those hostnames 404'd at
  # Google's edge for over an hour across many delete/redeploy cycles even
  # with a fully healthy, fully public (verified IAM + ingress) container
  # underneath -- while a same-flags service under an unused name worked
  # instantly. Cloud Run default URLs are deterministic (service name +
  # project number), so a delete/recreate under the old name reuses the
  # exact same hostname; a fresh name sidesteps whatever stuck edge routing
  # state that hostname had accumulated.
  _MCP_STAGING: assay-watch-mcp-staging2
  _WEB_STAGING: assay-watch-web-staging2
  # Optional. Create the secret and set this to its name to turn on live
  # listing lookups; left empty the MCP service simply reports live search
  # unconfigured and returns nothing, which is a supported state.
  _SERPAPI_KEY_SECRET: ""
  _MCP_RUNTIME_SA: assay-watch-mcp-runtime
  _WEB_RUNTIME_SA: assay-watch-web-runtime
  _READER_DB_SECRET: assay-watch-reader-db-url
  _GEMINI_KEY_SECRET: assay-watch-gemini-api-key
  _PROMOTE_TRIGGER: assay-watch-web-promote

steps:
  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - mcp_server/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-mcp:$SHORT_SHA
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-web:$SHORT_SHA
      - .

  - id: push-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-mcp:$SHORT_SHA

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-web:$SHORT_SHA

  - id: deploy-staging-and-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        MCP_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-mcp:$SHORT_SHA"
        WEB_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-web:$SHORT_SHA"
        MCP_SA="${_MCP_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com"
        WEB_SA="${_WEB_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com"

        echo "Deploying ${_MCP_STAGING}..."
        # Built up rather than inlined: naming a secret that does not exist
        # fails the deploy, so the SerpApi key is only passed when one has
        # actually been configured.
        MCP_SECRETS="ASSAY_READER_DATABASE_URL=${_READER_DB_SECRET}:latest"
        if [ -n "${_SERPAPI_KEY_SECRET}" ]; then
          MCP_SECRETS="$$MCP_SECRETS,SERPAPI_KEY=${_SERPAPI_KEY_SECRET}:latest"
          echo "Live listing search: enabled via secret ${_SERPAPI_KEY_SECRET}"
        else
          echo "Live listing search: disabled (no _SERPAPI_KEY_SECRET given)"
        fi

        gcloud run deploy ${_MCP_STAGING} \
          --project=$PROJECT_ID --region=${_REGION} \
          --image="$$MCP_IMAGE" \
          --service-account="$$MCP_SA" \
          --allow-unauthenticated --port=8080 \
          --set-secrets="$$MCP_SECRETS" \
          2>&1 | tee /tmp/mcp_deploy.log

        # Parsed from deploy's own report, not a separate `describe` call:
        # `describe --format=value(status.url)` has been observed returning
        # the legacy hash-based URL (SERVICE-HASH-REGIONCODE.a.run.app) for
        # this project even though only the newer project-number-based URL
        # (SERVICE-PROJECTNUMBER.REGION.run.app, printed here by deploy
        # itself) actually routes -- the legacy one 404s at Google's edge.
        MCP_URL="$$(awk '/Service URL:/{u=$$NF} END{print u}' /tmp/mcp_deploy.log)"
        echo "MCP staging URL: $$MCP_URL"

        echo "Deploying ${_WEB_STAGING}..."
        gcloud run deploy ${_WEB_STAGING} \
          --project=$PROJECT_ID --region=${_REGION} \
          --image="$$WEB_IMAGE" \
          --service-account="$$WEB_SA" \
          --allow-unauthenticated --port=8080 \
          --set-secrets="GEMINI_API_KEY=${_GEMINI_KEY_SECRET}:latest" \
          --set-env-vars="ASSAY_MCP_SERVER_URL=$$MCP_URL/mcp,ASSAY_BUILD_SHA=$SHORT_SHA" \
          2>&1 | tee /tmp/web_deploy.log

        WEB_URL="$$(awk '/Service URL:/{u=$$NF} END{print u}' /tmp/web_deploy.log)"
        echo "Web staging URL: $$WEB_URL"

        # Hits "/" rather than the app's own /healthz: requests to /healthz
        # on *.run.app started coming back with Google's edge 404 page --
        # not FastAPI's JSON 404, so they never reached the container at all
        # -- while "/" on the very same revision, in the same second, served
        # 200. It survived new revisions, a delete/recreate, and a rename, so
        # it tracks the path rather than the service (most likely edge abuse
        # mitigation, after this loop hammered that one path a few hundred
        # times while debugging). "/" exercises the same "is the container up
        # and publicly routable" question, so nothing is lost here; /healthz
        # stays in the app for external uptime monitoring.
        echo "Smoke test: reachability (retrying -- the allUsers IAM binding"
        echo "that makes a freshly-deployed revision public can take longer"
        echo "than a few seconds to actually take effect, even after the"
        echo "setIamPolicy API call itself reports done)..."
        HEALTH_OK=""
        for attempt in $(seq 1 30); do
          HTTP_CODE="$$(curl -s -o /dev/null -w '%{http_code}' "$$WEB_URL/" || echo curl_error)"
          if [ "$$HTTP_CODE" = "200" ]; then
            HEALTH_OK=1
            echo "attempt $$attempt/30: HTTP 200 -- service is up and public"
            break
          fi
          echo "attempt $$attempt/30: HTTP $$HTTP_CODE, retrying in 10s..."
          sleep 10
        done
        if [ -z "$$HEALTH_OK" ]; then
          echo "FAIL: service never returned HTTP 200 after 30 attempts (5 minutes)"
          exit 1
        fi

        echo "Smoke test: search resolution (exact reference number, no live"
        echo "inventory required -- this must resolve regardless of what the"
        echo "crawler happens to have found today)..."
        RESPONSE="$$(curl -sf -X POST "$$WEB_URL/api/search" \
          -H 'Content-Type: application/json' -d '{"query": "126610LN"}')"
        echo "Response: $$RESPONSE"
        echo "$$RESPONSE" | grep -q '"ref":"126610LN"' \
          || { echo "FAIL: reference resolution broken"; exit 1; }

        echo "Tagging verified images..."
        gcloud artifacts docker tags add "$$MCP_IMAGE" \
          "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-mcp:staging-verified" \
          --project=$PROJECT_ID
        gcloud artifacts docker tags add "$$WEB_IMAGE" \
          "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/assay-watch-web:staging-verified" \
          --project=$PROJECT_ID

        echo "Staging verified. Requesting production promotion (requires"
        echo "manual approval -- nothing deploys to production yet)..."
        gcloud builds triggers run ${_PROMOTE_TRIGGER} --project=$PROJECT_ID \
          --branch=main --substitutions=_PROMOTE_SHA=$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
